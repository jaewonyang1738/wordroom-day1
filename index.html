<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wordroom · Business English</title><style>
:root{--ink:#17211b;--muted:#718078;--paper:#f7f8f3;--card:#fff;--line:#e5e9e1;--green:#2f6b4f;--mint:#e7f0e8;--yellow:#f6e8b0;--red:#f8e2de}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}main{max-width:720px;margin:auto;padding:22px 18px 80px}.top{display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px;color:var(--green)}.day{color:var(--muted);font-size:13px}h1{font-size:30px;margin:30px 0 8px}p{color:var(--muted)}.day-tabs{display:flex;gap:8px;overflow:auto;margin:22px 0}.day-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 16px;white-space:nowrap}.day-tabs button.active{background:var(--ink);color:#fff}.hero{background:var(--green);color:#fff;border-radius:22px;padding:20px;margin:16px 0}.hero p{color:#d8e7da}.progress{height:7px;background:#ffffff33;border-radius:9px}.bar{height:100%;background:#f5df8d;border-radius:9px;width:0}.stats{margin-top:12px;font-size:13px}.stats b{font-size:18px;margin-right:3px}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 14px;white-space:nowrap}.word{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0}.wordtop{display:flex;justify-content:space-between;color:#9ba69f;font-size:12px}.tag{background:var(--mint);color:var(--green);padding:5px 8px;border-radius:7px}.en{font-size:22px;font-weight:800;margin:10px 0 3px}.pos{font-size:12px;color:var(--muted)}.meaning{margin-bottom:12px}.example{background:#f7f8f4;border-radius:10px;padding:11px;font-size:13px;line-height:1.5}.example em{display:block;color:var(--muted);margin-top:3px;font-style:normal}.actions{display:flex;gap:6px;margin-top:12px}.actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 3px;font-size:11px}.actions .sel{background:var(--mint);border-color:#a8c8ae}.empty{text-align:center;padding:35px;color:var(--muted)}@media(min-width:600px){.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}.word{margin:0}}
</style></head><body><main><div class="top"><div class="brand">WORDROOM</div><div class="day" id="today"></div></div><h1 id="title">Business English</h1><p id="subtitle">날짜별 단어장을 선택해 학습하세요.</p><nav class="day-tabs" id="dayTabs"></nav><section class="hero"><p>현재 Day 학습 진행률</p><div class="progress"><div class="bar" id="bar"></div></div><div class="stats"><b id="done">0</b>완료　<b id="review">0</b>다시 보기　<b id="left">20</b>남음</div></section><div class="filters"><button data-filter="all">전체</button><button data-filter="done">✅ 완료</button><button data-filter="review">🔁 다시 보기</button><button data-filter="miss">⏳ 미완료</button></div><section class="words" id="words"></section></main><script>
const days={
1:{name:'Business essentials',desc:'일의 흐름을 말하는 핵심 단어 20개',words:[['align','v.','의견·목표를 일치시키다','Let’s align on the project goals.','프로젝트 목표를 맞춰봅시다.','BUSINESS'],['agenda','n.','회의 안건, 의제','I’ll send the agenda this afternoon.','오늘 오후에 회의 안건을 보내겠습니다.','BUSINESS'],['allocate','v.','할당하다, 배분하다','We need to allocate more time.','더 많은 시간을 배분해야 합니다.','BUSINESS'],['approach','n.','접근 방식','This approach will reduce costs.','이 접근 방식은 비용을 줄일 것입니다.','BUSINESS'],['coordinate','v.','조율하다','I’ll coordinate with the design team.','디자인팀과 조율하겠습니다.','BUSINESS'],['deadline','n.','마감 기한','Can we meet the deadline?','마감 기한을 맞출 수 있을까요?','BUSINESS'],['deliverable','n.','결과물','The final deliverable is due Friday.','최종 결과물은 금요일까지입니다.','BUSINESS'],['efficient','adj.','효율적인','We need a more efficient process.','더 효율적인 프로세스가 필요합니다.','BUSINESS'],['feedback','n.','피드백, 의견','Thank you for your valuable feedback.','소중한 피드백 감사합니다.','BUSINESS'],['follow-up','n.','후속 조치','I’ll send a follow-up email tomorrow.','내일 후속 이메일을 보내겠습니다.','BUSINESS'],['implement','v.','실행하다','We will implement the new policy.','새 정책을 시행할 예정입니다.','BUSINESS'],['insight','n.','통찰','The report provides valuable insights.','보고서는 유용한 통찰을 제공합니다.','BUSINESS'],['negotiate','v.','협상하다','They are negotiating a better contract.','그들은 더 나은 계약을 협상 중입니다.','BUSINESS'],['objective','n.','목표','Our main objective is satisfaction.','우리의 주요 목표는 만족입니다.','BUSINESS'],['outcome','n.','결과','We are pleased with the outcome.','우리는 결과에 만족합니다.','BUSINESS'],['priority','n.','우선순위','Safety is our top priority.','안전이 최우선순위입니다.','BUSINESS'],['proactive','adj.','선제적인','A proactive approach prevents problems.','선제적 접근은 문제를 예방합니다.','COMMUNICATION'],['reliable','adj.','신뢰할 수 있는','We need a reliable partner.','신뢰할 수 있는 파트너가 필요합니다.','COMMUNICATION'],['strategy','n.','전략','Our marketing strategy needs an update.','마케팅 전략을 업데이트해야 합니다.','BUSINESS'],['transparent','adj.','투명한, 솔직한','Keep communication transparent.','소통을 투명하게 유지하세요.','COMMUNICATION']]},
2:{name:'Meetings & collaboration',desc:'회의와 협업에서 바로 쓰는 핵심 단어 20개',words:[['collaborate','v.','협업하다','We collaborate closely with our partners.','우리는 파트너와 긴밀히 협업합니다.','MEETING'],['consensus','n.','합의','We reached a consensus after discussion.','논의 후 합의에 도달했습니다.','MEETING'],['contribute','v.','기여하다','Everyone can contribute ideas.','모두가 아이디어를 기여할 수 있습니다.','MEETING'],['clarify','v.','명확히 하다','Could you clarify your point?','말씀하신 요점을 명확히 해주시겠어요?','MEETING'],['delegate','v.','위임하다','Good leaders know how to delegate.','좋은 리더는 위임하는 법을 압니다.','LEADERSHIP'],['facilitate','v.','촉진하다','She will facilitate the workshop.','그녀가 워크숍을 진행합니다.','MEETING'],['discuss','v.','논의하다','Let’s discuss the next steps.','다음 단계를 논의합시다.','MEETING'],['propose','v.','제안하다','I’d like to propose a new idea.','새 아이디어를 제안하고 싶습니다.','MEETING'],['approve','v.','승인하다','The director approved the budget.','이사가 예산을 승인했습니다.','BUSINESS'],['revise','v.','수정하다','Please revise the proposal.','제안서를 수정해 주세요.','BUSINESS'],['summarize','v.','요약하다','Could you summarize the key points?','핵심 내용을 요약해 주시겠어요?','MEETING'],['action item','n.','실행 항목','Let’s record each action item.','각 실행 항목을 기록합시다.','MEETING'],['participant','n.','참가자','All participants received the notes.','모든 참가자가 회의록을 받았습니다.','MEETING'],['perspective','n.','관점','I appreciate your perspective.','당신의 관점을 높이 평가합니다.','COMMUNICATION'],['resolve','v.','해결하다','We need to resolve this issue quickly.','이 문제를 신속히 해결해야 합니다.','BUSINESS'],['collaborative','adj.','협력적인','We have a collaborative culture.','우리는 협력적인 문화를 가지고 있습니다.','LEADERSHIP'],['accountability','n.','책임, 책무','Accountability builds trust.','책임감은 신뢰를 쌓습니다.','LEADERSHIP'],['agenda item','n.','의제 항목','The next agenda item is pricing.','다음 의제 항목은 가격입니다.','MEETING'],['alignment','n.','의견 일치','We need alignment across teams.','팀 간 의견 일치가 필요합니다.','MEETING'],['takeaway','n.','핵심 요점','What is your main takeaway?','가장 중요한 요점은 무엇인가요?','MEETING']]}}
let day=Number(localStorage.getItem('wr-current-day')||2),filter='all';const key=()=>`wr-state-${day}`;let state=JSON.parse(localStorage.getItem(key())||'{}');const $=id=>document.getElementById(id);function selectDay(n){day=n;localStorage.setItem('wr-current-day',n);state=JSON.parse(localStorage.getItem(key())||'{}');filter='all';render()}function setStatus(i,s){state[i]=state[i]===s?'':s;localStorage.setItem(key(),JSON.stringify(state));render()}function render(){const d=days[day];$('today').textContent='오늘 · '+new Date().toLocaleDateString('ko-KR');$('title').innerHTML=`Day ${String(day).padStart(2,'0')}<br><span style="color:var(--green)">${d.name}</span>`;$('subtitle').textContent=d.desc;$('dayTabs').innerHTML=Object.keys(days).map(n=>`<button class="${Number(n)===day?'active':''}" onclick="selectDay(${n})">Day ${String(n).padStart(2,'0')}</button>`).join('');let vals=Object.values(state),done=vals.filter(x=>x==='done').length,review=vals.filter(x=>x==='review').length;$('done').textContent=done;$('review').textContent=review;$('left').textContent=d.words.length-done;$('bar').style.width=(done/d.words.length*100)+'%';$('words').innerHTML=d.words.map((w,i)=>({w,i})).filter(x=>filter==='all'||state[x.i]===filter).map(({w,i})=>{let s=state[i]||'';return `<article class="word"><div class="wordtop"><span>${String(i+1).padStart(2,'0')}</span><span class="tag">${w[5]}</span></div><div class="en">${w[0]} <span class="pos">${w[1]}</span></div><div class="meaning">${w[2]}</div><div class="example">${w[3]}<em>${w[4]}</em></div><div class="actions"><button class="${s==='done'?'sel':''}" onclick="setStatus(${i},'done')">✅ 완료</button><button class="${s==='review'?'sel':''}" onclick="setStatus(${i},'review')">🔁 다시 보기</button><button class="${s==='miss'?'sel':''}" onclick="setStatus(${i},'miss')">⏳ 미완료</button><button onclick="speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance('${w[0]}'),{lang:'en-US',rate:.82}))">🔊 발음</button></div></article>`}).join('')||'<div class="empty">이 카테고리에 단어가 없습니다.</div>'}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});render();
</script></body></html>
