<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wordroom · Business English</title><style>
:root{--ink:#17211b;--muted:#718078;--paper:#f7f8f3;--card:#fff;--line:#e5e9e1;--green:#2f6b4f;--mint:#e7f0e8;--yellow:#f6e8b0;--red:#f8e2de}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}main{max-width:720px;margin:auto;padding:22px 18px 80px}.top{display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px;color:var(--green)}.day{color:var(--muted);font-size:13px}h1{font-size:30px;margin:30px 0 8px}p{color:var(--muted)}.day-tabs{display:flex;gap:8px;overflow:auto;margin:22px 0}.day-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 16px;white-space:nowrap}.day-tabs button.active{background:var(--ink);color:#fff}.hero{background:var(--green);color:#fff;border-radius:22px;padding:20px;margin:16px 0}.hero p{color:#d8e7da}.progress{height:7px;background:#ffffff33;border-radius:9px}.bar{height:100%;background:#f5df8d;border-radius:9px;width:0}.stats{margin-top:12px;font-size:13px}.stats b{font-size:18px;margin-right:3px}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 14px;white-space:nowrap}.word{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0}.wordtop{display:flex;justify-content:space-between;color:#9ba69f;font-size:12px}.tag{background:var(--mint);color:var(--green);padding:5px 8px;border-radius:7px}.en{font-size:22px;font-weight:800;margin:10px 0 3px}.pos{font-size:12px;color:var(--muted)}.meaning{margin-bottom:12px}.example{background:#f7f8f4;border-radius:10px;padding:11px;font-size:13px;line-height:1.5}.example em{display:block;color:var(--muted);margin-top:3px;font-style:normal}.actions{display:flex;gap:6px;margin-top:12px}.actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 3px;font-size:11px}.actions .sel{background:var(--mint);border-color:#a8c8ae}.empty{text-align:center;padding:35px;color:var(--muted)}@media(min-width:600px){.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}.word{margin:0}}
</style><style>
.view{animation:fade .2s}@keyframes fade{from{opacity:0}to{opacity:1}}
.bigbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px 20px;margin:12px 0;font-size:16px;font-weight:700;color:var(--ink);box-shadow:var(--shadow,0 6px 18px #2036290a)}
.bigbtn small{display:block;font-weight:500;color:var(--muted);margin-top:4px;font-size:13px}
.bigbtn b{color:var(--green)}
.streakbadge{background:var(--yellow);color:#7a5a00;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.studytop{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.studytop button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px}
.studytop .lbl{font-weight:700}.studytop .pg{margin-left:auto;color:var(--muted);font-size:13px}
.tap{background:#f7f8f4;border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;margin:12px 0}
.spk{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.grades{display:flex;gap:10px;margin-top:16px}
.grades .grade{flex:1;border:none;border-radius:14px;padding:15px 6px;font-size:15px;font-weight:700;color:#fff}
.grade.again{background:#d98b7a}.grade.ok{background:var(--green)}
.done{text-align:center;padding:30px 10px;font-size:20px;font-weight:800;color:var(--green)}
.donebtn{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;margin-top:10px;font-size:15px;font-weight:700}
.donebtn.primary{background:var(--green);color:#fff;border:none}
.hint{color:var(--muted);font-size:13px;margin:18px 0 8px}

.ko-prompt{font-size:21px;font-weight:700;line-height:1.5;margin:14px 0}
.en-answer{font-size:22px;font-weight:800;color:var(--green);margin:12px 0 2px;line-height:1.4}

.cat-label{font-size:12px;font-weight:700;color:var(--green);margin:12px 0 4px}
.cat-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.listtoggle{display:flex;gap:8px;margin:8px 0}
.listtoggle button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:700}
.listtoggle button.on{background:var(--ink);color:#fff}
#listTabs button.active{background:var(--ink);color:#fff}
.li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:8px 0}
.li-top{display:flex;align-items:center;gap:8px}
.li-top b{font-size:17px}
.li-ko{color:var(--ink);margin-top:4px}
.li-ex{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
.li-ex em{display:block;font-style:normal;color:#9ba69f}
.spk.mini{margin-left:auto;padding:5px 9px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:8px}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">WORDROOM</div><div class="streakbadge" id="streak">🔥 0일</div></div>

<div id="home" class="view">
  <h1 style="margin:24px 0 4px">오늘의 영어회화</h1>
  <div class="day" id="today"></div>
  <p id="subtitle">상황별 표현을 소리 내어 말하며 익혀요.</p>
  <button class="bigbtn" onclick="startReview()">🔁 오늘 복습 <b id="dueN">0</b>개<small id="dueSub"></small></button>
  <button class="bigbtn" onclick="startConvo()">🗣️ 오늘의 회화 표현<small id="convoSub"></small></button>
  <button class="bigbtn" onclick="startWeak()">📌 아직 못 외운 <b id="weakN">0</b>개<small>'또 볼래요/못 했어요' 표시한 것 모아 다시</small></button>
  <button class="bigbtn" style="padding:12px 16px;font-size:14px" onclick="startWord()">📖 단어 학습 (보조)<small id="wordSub"></small></button>
  <button class="bigbtn" style="padding:12px 16px;font-size:14px" onclick="openList('word')">📋 목록으로 보기 (한눈에 20개)<small>단어·표현을 한 화면에서 쭉 보기</small></button>
  <div class="hint">상황팩 골라 연습</div>
  <nav class="day-tabs" id="packTabs"></nav>
  <div class="hint">기록 백업 / 복원</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="bigbtn" style="padding:12px 16px;font-size:14px;margin:0" onclick="doBackup()">📤 내 기록 백업하기 (코드 복사)</button>
    <textarea id="bkText" placeholder="백업 코드를 여기에 붙여넣고 아래 복원을 누르세요" rows="2" style="border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:monospace"></textarea>
    <button class="bigbtn" style="padding:12px 16px;font-size:14px;margin:0" onclick="doRestore()">📥 백업 코드로 복원하기</button>
    <div id="bkMsg" style="color:var(--muted);font-size:13px;min-height:18px"></div>
  </div>
</div>

<div id="list" class="view" hidden>
  <div class="studytop"><button onclick="showHome()">← 홈</button><span class="lbl" id="listTitle"></span></div>
  <div class="listtoggle" id="listToggle"></div>
  <nav class="day-tabs" id="listTabs"></nav>
  <div id="listBody"></div>
</div>

<div id="study" class="view" hidden>
  <div class="studytop"><button onclick="showHome()">← 홈</button><span class="lbl" id="studylabel"></span><span class="pg" id="progress"></span></div>
  <section id="card"></section>
</div>
</main>
<script>
const days={
1:{name:'Business essentials',desc:'일의 흐름을 말하는 핵심 단어 20개',words:[['align','v.','의견·목표를 일치시키다','Let’s align on the project goals.','프로젝트 목표를 맞춰봅시다.','BUSINESS'],['agenda','n.','회의 안건, 의제','I’ll send the agenda this afternoon.','오늘 오후에 회의 안건을 보내겠습니다.','BUSINESS'],['allocate','v.','할당하다, 배분하다','We need to allocate more time.','더 많은 시간을 배분해야 합니다.','BUSINESS'],['approach','n.','접근 방식','This approach will reduce costs.','이 접근 방식은 비용을 줄일 것입니다.','BUSINESS'],['coordinate','v.','조율하다','I’ll coordinate with the design team.','디자인팀과 조율하겠습니다.','BUSINESS'],['deadline','n.','마감 기한','Can we meet the deadline?','마감 기한을 맞출 수 있을까요?','BUSINESS'],['deliverable','n.','결과물','The final deliverable is due Friday.','최종 결과물은 금요일까지입니다.','BUSINESS'],['efficient','adj.','효율적인','We need a more efficient process.','더 효율적인 프로세스가 필요합니다.','BUSINESS'],['feedback','n.','피드백, 의견','Thank you for your valuable feedback.','소중한 피드백 감사합니다.','BUSINESS'],['follow-up','n.','후속 조치','I’ll send a follow-up email tomorrow.','내일 후속 이메일을 보내겠습니다.','BUSINESS'],['implement','v.','실행하다','We will implement the new policy.','새 정책을 시행할 예정입니다.','BUSINESS'],['insight','n.','통찰','The report provides valuable insights.','보고서는 유용한 통찰을 제공합니다.','BUSINESS'],['negotiate','v.','협상하다','They are negotiating a better contract.','그들은 더 나은 계약을 협상 중입니다.','BUSINESS'],['objective','n.','목표','Our main objective is satisfaction.','우리의 주요 목표는 만족입니다.','BUSINESS'],['outcome','n.','결과','We are pleased with the outcome.','우리는 결과에 만족합니다.','BUSINESS'],['priority','n.','우선순위','Safety is our top priority.','안전이 최우선순위입니다.','BUSINESS'],['proactive','adj.','선제적인','A proactive approach prevents problems.','선제적 접근은 문제를 예방합니다.','COMMUNICATION'],['reliable','adj.','신뢰할 수 있는','We need a reliable partner.','신뢰할 수 있는 파트너가 필요합니다.','COMMUNICATION'],['strategy','n.','전략','Our marketing strategy needs an update.','마케팅 전략을 업데이트해야 합니다.','BUSINESS'],['transparent','adj.','투명한, 솔직한','Keep communication transparent.','소통을 투명하게 유지하세요.','COMMUNICATION']]},
2:{name:'Meetings & collaboration',desc:'회의와 협업에서 바로 쓰는 핵심 단어 20개',words:[['collaborate','v.','협업하다','We collaborate closely with our partners.','우리는 파트너와 긴밀히 협업합니다.','MEETING'],['consensus','n.','합의','We reached a consensus after discussion.','논의 후 합의에 도달했습니다.','MEETING'],['contribute','v.','기여하다','Everyone can contribute ideas.','모두가 아이디어를 기여할 수 있습니다.','MEETING'],['clarify','v.','명확히 하다','Could you clarify your point?','말씀하신 요점을 명확히 해주시겠어요?','MEETING'],['delegate','v.','위임하다','Good leaders know how to delegate.','좋은 리더는 위임하는 법을 압니다.','LEADERSHIP'],['facilitate','v.','촉진하다','She will facilitate the workshop.','그녀가 워크숍을 진행합니다.','MEETING'],['discuss','v.','논의하다','Let’s discuss the next steps.','다음 단계를 논의합시다.','MEETING'],['propose','v.','제안하다','I’d like to propose a new idea.','새 아이디어를 제안하고 싶습니다.','MEETING'],['approve','v.','승인하다','The director approved the budget.','이사가 예산을 승인했습니다.','BUSINESS'],['revise','v.','수정하다','Please revise the proposal.','제안서를 수정해 주세요.','BUSINESS'],['summarize','v.','요약하다','Could you summarize the key points?','핵심 내용을 요약해 주시겠어요?','MEETING'],['action item','n.','실행 항목','Let’s record each action item.','각 실행 항목을 기록합시다.','MEETING'],['participant','n.','참가자','All participants received the notes.','모든 참가자가 회의록을 받았습니다.','MEETING'],['perspective','n.','관점','I appreciate your perspective.','당신의 관점을 높이 평가합니다.','COMMUNICATION'],['resolve','v.','해결하다','We need to resolve this issue quickly.','이 문제를 신속히 해결해야 합니다.','BUSINESS'],['collaborative','adj.','협력적인','We have a collaborative culture.','우리는 협력적인 문화를 가지고 있습니다.','LEADERSHIP'],['accountability','n.','책임, 책무','Accountability builds trust.','책임감은 신뢰를 쌓습니다.','LEADERSHIP'],['agenda item','n.','의제 항목','The next agenda item is pricing.','다음 의제 항목은 가격입니다.','MEETING'],['alignment','n.','의견 일치','We need alignment across teams.','팀 간 의견 일치가 필요합니다.','MEETING'],['takeaway','n.','핵심 요점','What is your main takeaway?','가장 중요한 요점은 무엇인가요?','MEETING']]},3:{name:"Front desk & greeting",desc:"고객 응대 첫인사에서 바로 쓰는 단어 20개",words:[["welcome","v.","맞이하다, 환영하다","Welcome to LOWE, how can I help you?","로위에 오신 것을 환영합니다, 무엇을 도와드릴까요?","SERVICE"],["appointment","n.","예약","Do you have an appointment today?","오늘 예약이 있으신가요?","BOOKING"],["reception","n.","안내 데스크, 접수","Please wait at the reception.","안내 데스크에서 기다려 주세요.","SALON"],["assist","v.","돕다, 응대하다","I'll be happy to assist you.","기꺼이 도와드리겠습니다.","SERVICE"],["waiting","n.","대기","There is a short waiting time.","대기 시간이 잠깐 있습니다.","SERVICE"],["guide","v.","안내하다","Let me guide you to your seat.","자리로 안내해 드리겠습니다.","SERVICE"],["confirm","v.","확인하다","Let me confirm your booking.","예약을 확인해 드리겠습니다.","BOOKING"],["available","adj.","이용 가능한","That time slot is available.","그 시간대는 예약 가능합니다.","BOOKING"],["kindly","adv.","정중히, 부디","Kindly have a seat here.","이쪽에 앉아 주시기 바랍니다.","SERVICE"],["greeting","n.","인사","A warm greeting matters most.","따뜻한 인사가 가장 중요합니다.","SERVICE"],["visitor","n.","방문객","Every visitor gets a welcome drink.","모든 방문객에게 웰컴 음료를 드립니다.","SALON"],["register","v.","등록하다","May I register your details?","고객님 정보를 등록해도 될까요?","SERVICE"],["courteous","adj.","공손한, 예의 바른","Our staff is always courteous.","저희 직원은 항상 공손합니다.","SERVICE"],["assistance","n.","도움","Let me know if you need assistance.","도움이 필요하시면 말씀해 주세요.","SERVICE"],["escort","v.","안내하며 모시다","I'll escort you to the lounge.","라운지로 모시겠습니다.","SALON"],["patience","n.","인내, 기다려 주심","Thank you for your patience.","기다려 주셔서 감사합니다.","SERVICE"],["inquiry","n.","문의","We received your inquiry.","고객님의 문의를 접수했습니다.","SERVICE"],["comfortable","adj.","편안한","Please make yourself comfortable.","편안하게 계세요.","SALON"],["attend","v.","응대하다, 돌보다","Someone will attend to you shortly.","곧 응대해 드리겠습니다.","SERVICE"],["hospitality","n.","환대, 접객","We are proud of our hospitality.","저희는 환대를 자랑스럽게 여깁니다.","SALON"]]},4:{name:"Hair services",desc:"헤어 시술을 설명하는 핵심 단어 20개",words:[["haircut","n.","커트","Would you like a haircut today?","오늘 커트를 원하시나요?","HAIR"],["trim","v.","다듬다","I'll just trim the ends.","끝만 다듬어 드리겠습니다.","HAIR"],["perm","n.","펌","Our signature perm is very popular.","시그니처 펌이 인기가 많습니다.","HAIR"],["dye","v.","염색하다","Do you want to dye your hair?","염색을 원하시나요?","HAIR"],["bleach","v.","탈색하다","We need to bleach it first.","먼저 탈색을 해야 합니다.","HAIR"],["highlight","n.","하이라이트, 부분 염색","Highlights add natural volume.","하이라이트는 자연스러운 볼륨을 더합니다.","HAIR"],["layer","n.","레이어, 층","Layers make the style lighter.","레이어는 스타일을 가볍게 합니다.","HAIR"],["blow-dry","v.","드라이하다","I'll blow-dry your hair now.","이제 드라이해 드리겠습니다.","HAIR"],["scalp","n.","두피","Let's check your scalp condition.","두피 상태를 확인해 봅시다.","BEAUTY"],["texture","n.","머릿결, 질감","Your hair texture is very fine.","머릿결이 매우 가늘군요.","HAIR"],["volume","n.","볼륨","This cut adds more volume.","이 커트는 볼륨을 더해 줍니다.","HAIR"],["treatment","n.","트리트먼트, 관리","A treatment will repair the damage.","트리트먼트가 손상을 회복시켜 줍니다.","BEAUTY"],["straighten","v.","펴다, 매직","We can straighten it with heat.","열로 펴 드릴 수 있습니다.","HAIR"],["curl","n.","컬, 곱슬","Soft curls suit your face.","부드러운 컬이 얼굴형에 잘 맞습니다.","HAIR"],["bangs","n.","앞머리","Would you like to add bangs?","앞머리를 내 드릴까요?","HAIR"],["length","n.","길이","How much length should I keep?","길이를 얼마나 남길까요?","HAIR"],["shade","n.","색조, 톤","This shade brightens your skin.","이 색조가 피부를 화사하게 합니다.","BEAUTY"],["roots","n.","뿌리 (새로 자란 부분)","Your roots need a touch-up.","뿌리 염색이 필요합니다.","HAIR"],["style","v.","스타일링하다","I'll style it for the event.","행사에 맞춰 스타일링해 드리겠습니다.","HAIR"],["damage","n.","손상","Bleaching may cause damage.","탈색은 손상을 줄 수 있습니다.","BEAUTY"]]},5:{name:"Booking & schedule",desc:"예약과 일정 관리 단어 20개",words:[["reserve","v.","예약하다","I'd like to reserve a slot.","예약을 하고 싶습니다.","BOOKING"],["reschedule","v.","일정을 변경하다","Can we reschedule to Friday?","금요일로 변경할 수 있을까요?","BOOKING"],["cancel","v.","취소하다","I need to cancel my appointment.","예약을 취소해야 합니다.","BOOKING"],["slot","n.","시간대","The 3 PM slot is open.","오후 3시 시간대가 비어 있습니다.","BOOKING"],["availability","n.","예약 가능 여부","Let me check availability.","예약 가능 여부를 확인하겠습니다.","BOOKING"],["walk-in","n.","예약 없이 방문","We accept walk-ins on weekdays.","평일에는 예약 없이 방문 가능합니다.","SALON"],["fully booked","phr.","예약이 꽉 참","We are fully booked today.","오늘은 예약이 꽉 찼습니다.","BOOKING"],["remind","v.","상기시키다","I'll remind you the day before.","전날 다시 안내해 드리겠습니다.","SERVICE"],["arrange","v.","마련하다, 잡다","I'll arrange it for next week.","다음 주로 잡아 드리겠습니다.","BOOKING"],["preferred","adj.","선호하는","What is your preferred time?","선호하시는 시간이 언제인가요?","BOOKING"],["duration","n.","소요 시간","The service duration is two hours.","시술 소요 시간은 두 시간입니다.","SERVICE"],["waitlist","n.","대기자 명단","I'll add you to the waitlist.","대기자 명단에 올려 드리겠습니다.","BOOKING"],["overbook","v.","초과 예약하다","We must not overbook the stylists.","디자이너 예약을 초과하면 안 됩니다.","SALON"],["confirmation","n.","확정, 확인","You'll get a confirmation text.","확인 문자를 받으실 겁니다.","BOOKING"],["punctual","adj.","시간을 지키는","Please try to be punctual.","시간을 지켜 주시기 바랍니다.","SERVICE"],["no-show","n.","예약 부도","No-shows affect other guests.","예약 부도는 다른 고객께 영향을 줍니다.","SALON"],["book in advance","phr.","미리 예약하다","Please book in advance for weekends.","주말은 미리 예약해 주세요.","BOOKING"],["time frame","n.","시간 범위","What time frame works for you?","어떤 시간대가 편하신가요?","BOOKING"],["postpone","v.","연기하다","Let's postpone it by a week.","일주일 미루겠습니다.","BOOKING"],["fit in","phr.","시간을 끼워 넣다","I can fit you in at noon.","정오에 시간을 잡아 드릴 수 있습니다.","BOOKING"]]},6:{name:"Email & phone",desc:"이메일과 전화 소통 단어 20개",words:[["reach out","phr.","연락하다","Feel free to reach out anytime.","언제든 편하게 연락 주세요.","COMMUNICATION"],["attach","v.","첨부하다","I've attached the price list.","가격표를 첨부했습니다.","COMMUNICATION"],["reply","v.","답장하다","I'll reply by end of day.","오늘 안으로 답장드리겠습니다.","COMMUNICATION"],["forward","v.","전달하다","Let me forward this to the manager.","매니저에게 전달하겠습니다.","COMMUNICATION"],["regarding","prep.","~에 관하여","I'm writing regarding your booking.","예약 건으로 연락드립니다.","COMMUNICATION"],["notify","v.","알리다","We'll notify you of any change.","변경 사항이 있으면 알려 드리겠습니다.","COMMUNICATION"],["recipient","n.","수신인","Please check the const convo={1:{name:"스몰토크",desc:"가볍게 안부·인사 나누기",items:[["How's your day going?","오늘 하루 어떻게 지내세요?"],["Did you have a good weekend?","주말 잘 보내셨어요?"],["Nice weather today, isn't it?","오늘 날씨 좋네요, 그렇죠?"],["How was your trip?","여행 어떠셨어요?"],["Long time no see!","오랜만이에요!"],["What have you been up to?","요즘 어떻게 지내셨어요?"],["Thanks, you too!","고마워요, 당신도요!"],["It was great talking to you.","얘기 나눠서 즐거웠어요."],["Let's catch up soon.","조만간 또 봬요."],["I'm doing well, thanks for asking.","잘 지내요, 물어봐 줘서 고마워요."],["Same here.","저도 마찬가지예요."],["How about you?","당신은요?"]]},2:{name:"의견 말하기",desc:"내 생각을 자연스럽게 꺼내기",items:[["In my opinion, we should wait.","제 생각엔 기다리는 게 좋겠어요."],["I think that's a great idea.","좋은 생각인 것 같아요."],["From my point of view, it's risky.","제 관점에선 위험해요."],["I'd say it depends.","상황에 따라 다를 것 같아요."],["Honestly, I'm not sure about that.","솔직히 그건 잘 모르겠어요."],["If you ask me, we need more time.","제 생각엔 시간이 더 필요해요."],["That makes sense to me.","그거 일리가 있네요."],["I see it a little differently.","저는 조금 다르게 봐요."],["It seems to me that it won't work.","제가 보기엔 잘 안될 것 같아요."],["I'm leaning towards the first option.","저는 첫 번째 쪽으로 기울어요."],["Let me think about it.","좀 생각해 볼게요."],["That's a good point.","좋은 지적이에요."]]},3:{name:"동의·반대",desc:"공감하거나 정중히 반대하기",items:[["I completely agree.","전적으로 동의해요."],["You're absolutely right.","정말 맞는 말씀이에요."],["I'm afraid I disagree.","죄송하지만 저는 반대예요."],["I'm not so sure about that.","그건 좀 아닌 것 같아요."],["That's exactly what I was thinking.","제가 생각하던 게 바로 그거예요."],["I can see your point, but...","무슨 말인지 알겠지만..."],["Fair enough.","그럴 만하네요 / 인정해요."],["I'd have to disagree there.","그 부분은 동의하기 어려워요."],["Good point, I hadn't thought of that.","좋은 지적이에요, 미처 생각 못 했어요."],["I'm on the fence about this.","이건 아직 결정을 못 하겠어요."],["Absolutely.","물론이죠."],["I don't think that's a good idea.","그건 좋은 생각이 아닌 것 같아요."]]},4:{name:"되묻기·확인",desc:"못 알아들었을 때 자연스럽게 되묻기",items:[["Sorry, could you say that again?","죄송한데 다시 말씀해 주시겠어요?"],["What do you mean exactly?","정확히 무슨 뜻이세요?"],["Just to make sure, you mean this?","확인차 여쭤요, 이 말씀이시죠?"],["Could you speak a little slower?","조금만 천천히 말씀해 주시겠어요?"],["Let me make sure I understand.","제가 제대로 이해했는지 확인할게요."],["So, if I understand correctly...","제가 제대로 이해했다면..."],["Could you give me an example?","예를 들어 주시겠어요?"],["Sorry, I didn't catch that.","죄송해요, 못 알아들었어요."],["Do you mean A or B?","A 말씀이세요, B 말씀이세요?"],["Could you spell that for me?","철자 좀 불러 주시겠어요?"],["Does that make sense?","이해되셨어요?"],["Let me repeat that back to you.","제가 다시 한번 정리해 볼게요."]]},5:{name:"미팅",desc:"회의에서 흐름을 이끄는 말",items:[["Let's get started.","시작하죠."],["Let's get down to business.","본론으로 들어가죠."],["Can we move on to the next point?","다음 안건으로 넘어갈까요?"],["Let's circle back to that later.","그건 나중에 다시 다루죠."],["Can I add something here?","여기서 한마디 보태도 될까요?"],["Let me walk you through it.","제가 차근차근 설명드릴게요."],["To sum up, we agree on the plan.","요약하자면, 계획에 동의하는 거예요."],["Let's wrap this up.","이쯤에서 마무리하죠."],["What are the next steps?","다음 단계는 뭔가요?"],["Let's table this for now.","이건 일단 보류하죠."],["Does anyone have any questions?","질문 있으신 분?"],["I'll follow up by email.","이메일로 다시 정리해 드릴게요."]]},6:{name:"전화·화상",desc:"콜·화상회의에서 쓰는 말",items:[["Can you hear me okay?","제 목소리 잘 들리세요?"],["You're breaking up a little.","소리가 좀 끊겨요."],["I think you're on mute.","음소거 되신 것 같아요."],["Let me share my screen.","화면 공유할게요."],["Can we reschedule the call?","통화 일정을 다시 잡을 수 있을까요?"],["I'll call you back in five minutes.","5분 뒤에 다시 전화드릴게요."],["Thanks for jumping on this call.","통화에 함께해 주셔서 감사해요."],["Let's take this offline.","이건 따로 얘기하죠."],["I'll send you the details by email.","자세한 건 이메일로 보내드릴게요."],["Could you speak up a bit?","조금만 더 크게 말씀해 주시겠어요?"],["I have a hard stop at three.","저는 3시에 꼭 끝내야 해요."],["Can everyone see my screen?","제 화면 다들 보이세요?"]]},7:{name:"부탁·제안",desc:"정중하게 부탁하고 제안하기",items:[["Could you do me a favor?","부탁 하나 드려도 될까요?"],["Would you mind helping me with this?","이것 좀 도와주실 수 있을까요?"],["Why don't we try a different approach?","다른 방법을 시도해 보는 게 어때요?"],["How about we meet on Friday?","금요일에 만나는 건 어때요?"],["Can I ask you something?","뭐 하나 여쭤봐도 될까요?"],["Let me know if you need anything.","필요한 거 있으면 말씀해 주세요."],["Would it be possible to extend the deadline?","혹시 기한을 늘릴 수 있을까요?"],["I was wondering if you could help.","혹시 도와주실 수 있을까 해서요."],["Feel free to reach out anytime.","언제든 편하게 연락 주세요."],["Shall we get some coffee?","커피 한잔 할까요?"],["Do you want me to help?","제가 도와드릴까요?"],["Let's give it a try.","한번 해 보죠."]]},8:{name:"사교·네트워킹",desc:"처음 만난 사람과 관계 트기",items:[["Nice to meet you.","만나서 반가워요."],["What do you do?","무슨 일 하세요?"],["How long have you been with the company?","회사에 다니신 지 얼마나 되셨어요?"],["Here's my business card.","제 명함이에요."],["Let's stay in touch.","연락하고 지내요."],["It was a pleasure meeting you.","만나서 반가웠어요."],["What brings you here?","어떻게 오셨어요? (무슨 일로)"],["Can I get you a drink?","마실 것 좀 가져다드릴까요?"],["I've heard a lot about you.","말씀 많이 들었어요."],["We should grab lunch sometime.","언제 점심 같이 해요."],["Enjoy the rest of your day.","남은 하루 잘 보내세요."],["How do you two know each other?","두 분은 어떻게 아는 사이세요?"]]},9:{name:"감정·리액션",desc:"짧게 반응하고 공감하기",items:[["That's great news!","정말 좋은 소식이네요!"],["I'm so happy for you.","정말 잘됐어요."],["That's too bad.","그거 안됐네요."],["No worries.","괜찮아요 / 걱정 마세요."],["Sounds good to me.","좋아요 / 괜찮은 것 같아요."],["That makes sense.","그렇군요 / 이해돼요."],["I can't believe it!","믿기지 않아요!"],["Good for you!","잘됐네요!"],["That's a relief.","다행이에요."],["I really appreciate it.","정말 감사해요."],["Don't worry about it.","신경 쓰지 마세요."],["Wow, that's impressive.","와, 대단하네요."]]},10:{name:"일정·약속",desc:"약속 잡고 조율하기",items:[["Are you free on Thursday?","목요일에 시간 괜찮으세요?"],["Does 2 p.m. work for you?","오후 2시 괜찮으세요?"],["Let's set up a meeting.","미팅을 잡죠."],["I'll check my calendar.","일정 확인해 볼게요."],["Can we push it to next week?","다음 주로 미룰 수 있을까요?"],["Something came up.","일이 좀 생겼어요."],["I'm running a bit late.","조금 늦을 것 같아요."],["Let's say 10 o'clock then.","그럼 10시로 하죠."],["What time works best for you?","몇 시가 가장 좋으세요?"],["Let me get back to you on that.","그건 다시 알려드릴게요."],[" const WR_START=Date.UTC(2026,8,14);
const WR_MAX=Math.max(...Object.keys(days).map(Number));
const CONVO_MAX=Math.max(...Object.keys(convo).map(Number));
const PACKCAT={"1": "회화기본", "2": "회화기본", "3": "회화기본", "4": "회화기본", "5": "비즈니스", "6": "비즈니스", "7": "회화기본", "8": "회화기본", "9": "회화기본", "10": "비즈니스", "11": "비즈니스", "12": "비즈니스", "13": "비즈니스", "14": "비즈니스", "15": "여행", "16": "여행", "17": "여행", "18": "여행", "19": "일상생활", "20": "일상생활"};
var listKind='word',listN=1;
function openList(kind){listKind=kind;listN=(kind==='word')?wrToday():convoDayNow();renderList();}
function listGo(k){listN=k;renderList();}
function renderList(){
  $('home').hidden=true;$('study').hidden=true;$('list').hidden=false;
  $('listToggle').innerHTML='<button class="'+(listKind==='word'?'on':'')+'" onclick="openList(\'word\')">📖 단어</button><button class="'+(listKind==='convo'?'on':'')+'" onclick="openList(\'convo\')">🗣️ 회화</button>';
  var max=(listKind==='word')?WR_MAX:CONVO_MAX,tabs='';
  for(var k=1;k<=max;k++){var nm=(listKind==='word')?('Day '+String(k).padStart(2,'0')):convo[k].name;tabs+='<button class="'+(k===listN?'active':'')+'" onclick="listGo('+k+')">'+nm+'</button>';}
  $('listTabs').innerHTML=tabs;
  var body='';
  if(listKind==='word'){var d=days[listN];$('listTitle').textContent='Day '+String(listN).padStart(2,'0')+' · '+d.name;
    body=d.words.map(function(w){return '<div class="li"><div class="li-top"><b>'+w[0]+'</b> <span class="pos">'+w[1]+'</span><button class="spk mini" onclick="speak(\''+w[0].replace(/'/g,"\\'")+'\')">🔊</button></div><div class="li-ko">'+w[2]+'</div><div class="li-ex">'+w[3]+'<em>'+w[4]+'</em></div></div>';}).join('');
  }else{var p=convo[listN];$('listTitle').textContent=p.name+' · '+p.desc;
    body=p.items.map(function(it){return '<div class="li"><div class="li-top"><b>'+it[0]+'</b><button class="spk mini" onclick="speak(\''+it[0].replace(/'/g,"\\'")+'\')">🔊</button></div><div class="li-ko">'+it[1]+'</div></div>';}).join('');
  }
  $('listBody').innerHTML=body;
}

function wrToday(){var n=new Date();var t=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.min(WR_MAX,Math.max(1,Math.floor((t-WR_START)/86400000)+1));}
const $=id=>document.getElementById(id);
const INT={1:1,2:3,3:7,4:16,5:35};
function todayStr(){var n=new Date();return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate();}
function dnum(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function addDays(k){var n=new Date();n.setDate(n.getDate()+k);return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate();}
function loadSrs(){try{return JSON.parse(localStorage.getItem('wr-srs')||'{}')}catch(e){return{}}}
function saveSrs(o){try{localStorage.setItem('wr-srs',JSON.stringify(o))}catch(e){}}
var srs=loadSrs();
function grade(id,ok){var r=srs[id]||{box:0};var b=ok?Math.min(5,(r.box||0)+1):1;srs[id]={box:b,due:addDays(INT[b]),again:!ok};saveSrs(srs);bumpStreak();}
function resolveItem(id){
  if(id.indexOf('c:')===0){var p=id.split(':'),P=+p[1],i=+p[2];if(convo[P]&&convo[P].items[i]){var it=convo[P].items[i];return{type:'phrase',id:id,en:it[0],ko:it[1],label:'회화 · '+convo[P].name};}return null;}
  var q=id.split(':'),d=+q[0],j=+q[1];if(days[d]&&days[d].words[j]){var w=days[d].words[j];return{type:'word',id:id,en:w[0],pos:w[1],ko:w[2],ex:w[3],exko:w[4],tag:w[5],label:'Day '+String(d).padStart(2,'0')};}return null;
}
function dueList(){var t=dnum(todayStr()),out=[];for(var id in srs){if(srs[id]&&dnum(srs[id].due)<=t){var it=resolveItem(id);if(it)out.push(it);}}return out;}
function weakList(){var out=[];for(var id in srs){if(srs[id]&&srs[id].again){var it=resolveItem(id);if(it)out.push(it);}}return out;}
function loadStreak(){try{return JSON.parse(localStorage.getItem('wr-streak')||'{}')}catch(e){return{}}}
function bumpStreak(){var s=loadStreak(),ts=todayStr();if(s.last===ts)return;var t=dnum(ts);s.count=(s.last&&dnum(s.last)===t-86400000)?(s.count||0)+1:1;s.last=ts;try{localStorage.setItem('wr-streak',JSON.stringify(s))}catch(e){}renderStreak();}
function renderStreak(){var s=loadStreak();if($('streak'))$('streak').textContent='🔥 '+(s.count||0)+'일';}
function speak(w){try{speechSynthesis.cancel();speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'en-US',rate:.82}))}catch(e){}}
function convoDayNow(){var v=parseInt(localStorage.getItem('wr-convo-day')||'1',10);if(isNaN(v)||v<1)v=1;return Math.min(CONVO_MAX,v);}

var queue=[],qi=0,revealed=false,mode='review',advanceConvo=false;

function showHome(){
  $('study').hidden=true;$('list').hidden=true;$('home').hidden=false;
  $('today').textContent='오늘 · '+new Date().toLocaleDateString('ko-KR');
  var due=dueList();$('dueN').textContent=due.length;
  $('dueSub').textContent=due.length?'회상·말하기로 기억을 굳혀요':'복습할 게 없어요 — 새 표현으로!';
  var cd=convoDayNow();$('convoSub').textContent='Pack '+String(cd).padStart(2,'0')+' · '+convo[cd].name;
  var weak=weakList();$('weakN').textContent=weak.length;
  $('wordSub').textContent='Day '+String(wrToday()).padStart(2,'0')+' · 단어 20개';
  renderStreak();
  var _g={};Object.keys(convo).forEach(function(n){var c=(typeof PACKCAT!=='undefined'&&PACKCAT[n])||'기타';(_g[c]=_g[c]||[]).push(n);});
  $('packTabs').innerHTML=Object.keys(_g).map(function(c){return '<div class="cat-label">'+c+'</div><div class="cat-row">'+_g[c].map(function(n){return '<button onclick="openPack('+n+')">'+convo[n].name+'</button>';}).join('')+'</div>';}).join('');
}
function beginStudy(label){$('home').hidden=true;$('study').hidden=false;$('studylabel').textContent=label;qi=0;showCard();}
function startReview(){queue=dueList();if(!queue.length){showHome();return;}mode='review';advanceConvo=false;beginStudy('🔁 오늘 복습');}
function startConvo(){var cd=convoDayNow();queue=convo[cd].items.map(function(it,i){return{type:'phrase',id:'c:'+cd+':'+i,en:it[0],ko:it[1],label:'회화 · '+convo[cd].name};});mode='convo';advanceConvo=true;beginStudy('🗣️ '+convo[cd].name);}
function openPack(n){queue=convo[n].items.map(function(it,i){return{type:'phrase',id:'c:'+n+':'+i,en:it[0],ko:it[1],label:'회화 · '+convo[n].name};});mode='convo';advanceConvo=false;beginStudy('🗣️ '+convo[n].name);}
function startWeak(){queue=weakList();if(!queue.length){showHome();return;}mode='weak';advanceConvo=false;beginStudy('📌 아직 못 외운');}
function startWord(){var d=wrToday();queue=days[d].words.map(function(w,i){return{type:'word',id:d+':'+i,en:w[0],pos:w[1],ko:w[2],ex:w[3],exko:w[4],tag:w[5],label:'Day '+String(d).padStart(2,'0')};});mode='word';advanceConvo=false;beginStudy('📖 Day '+String(d).padStart(2,'0')+' 단어');}
function showCard(){revealed=(mode==='word');renderCard();}
function reveal(){revealed=true;renderCard();}
function doGrade(ok){var it=queue[qi];if(it)grade(it.id,ok);qi++;showCard();}
function renderCard(){
  if(qi>=queue.length){
    var h='<div class="done">✅ 다 했어요!</div>';
    if(mode==='convo'&&advanceConvo){var cd=convoDayNow();var nx=Math.min(CONVO_MAX,cd+1);localStorage.setItem('wr-convo-day',nx);if(nx!==cd)h+='<div class="hint" style="text-align:center">다음: '+convo[nx].name+'</div>';}
    if(mode==='review')h+='<button class="donebtn primary" onclick="startConvo()">🗣️ 오늘의 회화 표현 →</button>';
    h+='<button class="donebtn" onclick="showHome()">홈으로</button>';
    $('card').innerHTML=h;$('progress').textContent='';return;
  }
  var it=queue[qi];$('progress').textContent=(qi+1)+' / '+queue.length;
  var html='';
  if(it.type==='phrase'){
    // 한국어 → 영어 말하기(산출)
    html='<article class="word"><div class="wordtop"><span>'+it.label+'</span><span class="tag">말하기</span></div>'
      +'<div class="ko-prompt">'+it.ko+'</div>';
    if(!revealed){ html+='<div class="tap" onclick="reveal()">👄 영어로 말해본 뒤, 탭해서 확인</div>'; }
    else { html+='<div class="en-answer">'+it.en+'</div><button class="spk" onclick="speak(\''+it.en.replace(/'/g,"\'")+'\')">🔊 원어민 발음 (따라 말하기)</button>'
      +'<div class="grades"><button class="grade again" onclick="doGrade(false)">못 했어요</button><button class="grade ok" onclick="doGrade(true)">말했어요</button></div>'; }
    html+='</article>';
  } else {
    // 영어 → 뜻 (단어 회상)
    html='<article class="word"><div class="wordtop"><span>'+it.label+'</span><span class="tag">'+(it.tag||'')+'</span></div>'
      +'<div class="en">'+it.en+' <span class="pos">'+(it.pos||'')+'</span></div>';
    if(!revealed){ html+='<div class="tap" onclick="reveal()">뜻 보기 (탭)</div>'; }
    else { html+='<div class="meaning">'+it.ko+'</div><div class="example">'+(it.ex||'')+'<em>'+(it.exko||'')+'</em></div><button class="spk" onclick="speak(\''+it.en.replace(/'/g,"\'")+'\')">🔊 발음</button>'
      +'<div class="grades"><button class="grade again" onclick="doGrade(false)">또 볼래요</button><button class="grade ok" onclick="doGrade(true)">알아요</button></div>'; }
    html+='</article>';
  }
  $('card').innerHTML=html;
}
function doBackup(){var p={v:2,srs:loadSrs(),streak:loadStreak(),convoDay:convoDayNow(),ts:todayStr()};var code=btoa(unescape(encodeURIComponent(JSON.stringify(p))));var ta=$('bkText');if(ta)ta.value=code;try{navigator.clipboard.writeText(code);$('bkMsg').textContent='✅ 백업 코드를 복사했어요. 메모앱 등 안전한 곳에 붙여넣어 두세요.';}catch(e){if(ta){ta.focus();ta.select();}$('bkMsg').textContent='아래 코드를 길게 눌러 전체 복사해 두세요.';}}
function doRestore(){var ta=$('bkText');var code=(ta&&ta.value||'').trim();if(!code){$('bkMsg').textContent='백업 코드를 먼저 붙여넣어 주세요.';return;}try{var p=JSON.parse(decodeURIComponent(escape(atob(code))));if(!p||!p.srs)throw 0;saveSrs(p.srs);if(p.streak)localStorage.setItem('wr-streak',JSON.stringify(p.streak));if(p.convoDay)localStorage.setItem('wr-convo-day',p.convoDay);srs=loadSrs();$('bkMsg').textContent='✅ 복원 완료! 기록을 되살렸어요.';showHome();}catch(e){$('bkMsg').textContent='⚠️ 코드가 올바르지 않아요. 복사한 코드 전체를 다시 붙여넣어 주세요.';}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('home').hidden)showHome();});
showHome();</script>
