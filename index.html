1:{name:'Business essentials',desc:'일의 흐름을 말하는 핵심 단어 20개',words:[['align','v.','의견·목표를 일치시키다','Let’s align on the project goals.','프로젝트 목표를 맞춰봅시다.','BUSINESS'],['agenda','n.','회의 안건, 의제','I’ll send the agenda this afternoon.','오늘 오후에 회의 안건을 보내겠습니다.','BUSINESS'],['allocate','v.','할당하다, 배분하다','We need to allocate more time.','더 많은 시간을 배분해야 합니다.','BUSINESS'],['approach','n.','접근 방식','This approach will reduce costs.','이 접근 방식은 비용을 줄일 것입니다.','BUSINESS'],['coordinate','v.','조율하다','I’ll coordinate with the design team.','디자인팀과 조율하겠습니다.','BUSINESS'],['deadline','n.','마감 기한','Can we meet the deadline?','마감 기한을 맞출 수 있을까요?','BUSINESS'],['deliverable','n.','결과물','The final deliverable is due Friday.','최종 결과물은 금요일까지입니다.','BUSINESS'],['efficient','adj.','효율적인','We need a more efficient process.','더 효율적인 프로세스가 필요합니다.','BUSINESS'],['feedback','n.','피드백, 의견','Thank you for your valuable feedback.','소중한 피드백 감사합니다.','BUSINESS'],['follow-up','n.','후속 조치','I’ll send a follow-up email tomorrow.','내일 후속 이메일을 보내겠습니다.','BUSINESS'],['implement','v.','실행하다','We will implement the new policy.','새 정책을 시행할 예정입니다.','BUSINESS'],['insight','n.','통찰','The report provides valuable insights.','보고서는 유용한 통찰을 제공합니다.','BUSINESS'],['negotiate','v.','협상하다','They are negotiating a better contract.','그들은 더 나은 계약을 협상 중입니다.','BUSINESS'],['objective','n.','목표','Our main objective is satisfaction.','우리의 주요 목표는 만족입니다.','BUSINESS'],['outcome','n.','결과','We are pleased with the outcome.','우리는 결과에 만족합니다.','BUSINESS'],['priority','n.','우선순위','Safety is our top priority.','안전이 최우선순위입니다.','BUSINESS'],['proactive','adj.','선제적인','A proactive approach prevents problems.','선제적 접근은 문제를 예방합니다.','COMMUNICATION'],['reliable','adj.','신뢰할 수 있는','We need a reliable partner.','신뢰할 수 있는 파트너가 필요합니다.','COMMUNICATION'],['strategy','n.','전략','Our marketing strategy needs an update.','마케팅 전략을 업데이트해야 합니다.','BUSINESS'],['transparent','adj.','투명한, 솔직한','Keep communication transparent.','소통을 투명하게 유지하세요.','COMMUNICATION']]},
2:{name:'Meetings & collaboration',desc:'회의와 협업에서 바로 쓰는 핵심 단어 20개',words:[['collaborate','v.','협업하다','We collaborate closely with our partners.','우리는 파트너와 긴밀히 협업합니다.','MEETING'],['consensus','n.','합의','We reached a consensus after discussion.','논의 후 합의에 도달했습니다.','MEETING'],['contribute','v.','기여하다','Everyone can contribute ideas.','모두가 아이디어를 기여할 수 있습니다.','MEETING'],['clarify','v.','명확히 하다','Could you clarify your point?','말씀하신 요점을 명확히 해주시겠어요?','MEETING'],['delegate','v.','위임하다','Good leaders know how to delegate.','좋은 리더는 위임하는 법을 압니다.','LEADERSHIP'],['facilitate','v.','촉진하다','She will facilitate the workshop.','그녀가 워크숍을 진행합니다.','MEETING'],['discuss','v.','논의하다','Let’s discuss the next steps.','다음 단계를 논의합시다.','MEETING'],['propose','v.','제안하다','I’d like to propose a new idea.','새 아이디어를 제안하고 싶습니다.','MEETING'],['approve','v.','승인하다','The director approved the budget.','이사가 예산을 승인했습니다.','BUSINESS'],['revise','v.','수정하다','Please revise the proposal.','제안서를 수정해 주세요.','BUSINESS'],['summarize','v.','요약하다','Could you summarize the key points?','핵심 내용을 요약해 주시겠어요?','MEETING'],['action item','n.','실행 항목','Let’s record each action item.','각 실행 항목을 기록합시다.','MEETING'],['participant','n.','참가자','All participants received the notes.','모든 참가자가 회의록을 받았습니다.','MEETING'],['perspective','n.','관점','I appreciate your perspective.','당신의 관점을 높이 평가합니다.','COMMUNICATION'],['resolve','v.','해결하다','We need to resolve this issue quickly.','이 문제를 신속히 해결해야 합니다.','BUSINESS'],['collaborative','adj.','협력적인','We have a collaborative culture.','우리는 협력적인 문화를 가지고 있습니다.','LEADERSHIP'],['accountability','n.','책임, 책무','Accountability builds trust.','책임감은 신뢰를 쌓습니다.','LEADERSHIP'],['agenda item','n.','의제 항목','The next agenda item is pricing.','다음 의제 항목은 가격입니다.','MEETING'],['alignment','n.','의견 일치','We need alignment across teams.','팀 간 의견 일치가 필요합니다.','MEETING'],['takeaway','n.','핵심 요점','What is your main takeaway?','가장 중요한 요점은 무엇인가요?','MEETING']]},3:{name:"Front desk & greeting",desc:"고객 응대 첫인사에서 바로 쓰는 단어 20개",words:[["welcome","v.","맞이하다, 환영하다","Welcome to LOWE, how can I help you?","로위에 오신 것을 환영합니다, 무엇을 도와드릴까요?","SERVICE"],["appointment","n.","예약","Do you have an appointment today?","오늘 예약이 있으신가요?","BOOKING"],["reception","n.","안내 데스크, 접수","Please wait at the reception.","안내 데스크에서 기다려 주세요.","SALON"],["assist","v.","돕다, 응대하다","I'll be happy to assist you.","기꺼이 도와드리겠습니다.","SERVICE"],["waiting","n.","대기","There is a short waiting time.","대기 시간이 잠깐 있습니다.","SERVICE"],["guide","v.","안내하다","Let me guide you to your seat.","자리로 안내해 드리겠습니다.","SERVICE"],["confirm","v.","확인하다","Let me confirm your booking.","예약을 확인해 드리겠습니다.","BOOKING"],["available","adj.","이용 가능한","That time slot is available.","그 시간대는 예약 가능합니다.","BOOKING"],["kindly","adv.","정중히, 부디","Kindly have a seat here.","이쪽에 앉아 주시기 바랍니다.","SERVICE"],["greeting","n.","인사","A warm greeting matters most.","따뜻한 인사가 가장 중요합니다.","SERVICE"],["visitor","n.","방문객","Every visitor gets a welcome drink.","모든 방문객에게 웰컴 음료를 드립니다.","SALON"],["register","v.","등록하다","May I register your details?","고객님 정보를 등록해도 될까요?","SERVICE"],["courteous","adj.","공손한, 예의 바른","Our staff is always courteous.","저희 직원은 항상 공손합니다.","SERVICE"],["assistance","n.","도움","Let me know if you need assistance.","도움이 필요하시면 말씀해 주세요.","SERVICE"],["escort","v.","안내하며 모시다","I'll escort you to the lounge.","라운지로 모시겠습니다.","SALON"],["patience","n.","인내, 기다려 주심","Thank you for your patience.","기다려 주셔서 감사합니다.","SERVICE"],["inquiry","n.","문의","We received your inquiry.","고객님의 문의를 접수했습니다.","SERVICE"],["comfortable","adj.","편안한","Please make yourself comfortable.","편안하게 계세요.","SALON"],["attend","v.","응대하다, 돌보다","Someone will attend to you shortly.","곧 응대해 드리겠습니다.","SERVICE"],["hospitality","n.","환대, 접객","We are proud of our hospitality.","저희는 환대를 자랑스럽게 여깁니다.","SALON"]]},4:{name:"Hair services",desc:"헤어 시술을 설명하는 핵심 단어 20개",words:[["haircut","n.","커트","Would you like a haircut today?","오늘 커트를 원하시나요?","HAIR"],["trim","v.","다듬다","I'll just trim the ends.","끝만 다듬어 드리겠습니다.","HAIR"],["perm","n for(let n=21;n<=100;n++){const t=tracks[(n-3)%tracks.length];const start=((n-3)*20)%coreWords.length;const words=[];for(let i=0;i<20;i++){const base=coreWords[(start+i)%coreWords.length];words.push([base[0],base[1],base[2],`We use ${base[0]} to improve our ${t[0].toLowerCase()} results.`,`우리는 ${t[1]} 성과를 높이기 위해 ${base[0]}을(를) 활용합니다.`,t[2]])}days[n]={name:`${t[0]} · Day ${String(n).padStart(2,'0')}`,desc:`${t[1]}에서 바로 쓰는 핵심 단어 20개`,words}}
let day=Number(localStorage.getItem('wr-current-day')||2),filter='all';const key=n=>`wr-state-${n}`;let state=JSON.parse(localStorage.getItem(key(day))||'{}');const $=id=>document.getElementById(id);function loadState(n){return JSON.parse(localStorage.getItem(key(n))||'{}')}function weakWords(){return Object.entries(days).flatMap(([n,d])=>{const s=loadState(n);return d.words.map((w,i)=>({w,i,day:Number(n),status:s[i]||''})).filter(x=>x.status==='review'||x.status==='miss')})}function selectDay(n){day=n;localStorage.setItem('wr-current-day',n);state=loadState(n);filter='all';render()}function setStatus(i,s){state[i]=state[i]===s?'':s;localStorage.setItem(key(day),JSON.stringify(state));render()}function render(){const d=days[day];$('today').textContent='오늘 · '+new Date().toLocaleDateString('ko-KR');$('title').innerHTML=`Day ${String(day).padStart(2,'0')}<br><span style="color:var(--green)">${d.name}</span>`;$('subtitle').textContent=d.desc;$('dayTabs').innerHTML=Object.keys(days).map(n=>`<button class="${Number(n)===day?'active':''}" onclick="selectDay(${n})">Day ${String(n).padStart(2,'0')}</button>`).join('');let vals=Object.values(state),done=vals.filter(x=>x==='done').length,review=vals.filter(x=>x==='review').length;$('done').textContent=done;$('review').textContent=review;$('left').textContent=d.words.length-done;$('bar').style.width=(done/d.words.length*100)+'%';const list=filter==='weak'?weakWords():d.words.map((w,i)=>({w,i,day,status:state[i]||''})).filter(x=>filter==='all'||x.status===filter);$('words').innerHTML=list.map(({w,i,day:wordDay,status})=>{let s=status||'';return `<article class="word"><div class="wordtop"><span>Day ${String(wordDay).padStart(2,'0')} · ${String(i+1).padStart(2,'0')}</span><span class="tag">${w[5]}</span></div><div class="en">${w[0]} <span class="pos">${w[1]}</span></div><div class="meaning">${w[2]}</div><div class="example">${w[3]}<em>${w[4]}</em></div><div class="actions"><button class="${s==='done'?'sel':''}" onclick="selectDay(${wordDay});setStatus(${i},'done')">✅ 완료</button><button class="${s==='review'?'sel':''}" onclick="selectDay(${wordDay});setStatus(${i},'review')">🔁 다시 보기</button><button class="${s==='miss'?'sel':''}" onclick="selectDay(${wordDay});setStatus(${i},'miss')">⏳ 미완료</button><button onclick="speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance('${w[0]}'),{lang:'en-US',rate:.82}))">🔊 발음</button></div></article>`}).join('')||'<div class="empty">미숙한 단어가 없습니다.</div>'}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});render();
