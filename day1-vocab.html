<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wordroom · Day 01</title><link rel="manifest" href="wordroom-manifest.json"><meta name="theme-color" content="#2f6b4f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Wordroom">
<style>
:root{--ink:#17211b;--muted:#718078;--paper:#f7f8f3;--card:#fff;--line:#e5e9e1;--green:#2f6b4f;--mint:#e7f0e8;--yellow:#f6e8b0;--red:#f8e2de;--shadow:0 10px 30px #2036290d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}main{max-width:720px;margin:auto;padding:22px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:2px;font-weight:800;color:var(--green)}.day{font-size:13px;color:var(--muted)}h1{font-size:31px;line-height:1.15;margin:30px 0 8px;letter-spacing:-1px}p{color:var(--muted);margin:0}.hero{margin:26px 0 18px;background:var(--green);color:white;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.hero p{color:#d8e7da;font-size:13px}.progress{height:7px;background:#ffffff30;border-radius:99px;margin-top:20px;overflow:hidden}.bar{height:100%;width:0;background:#f5df8d;border-radius:99px;transition:.3s}.stats{display:flex;gap:8px;margin-top:13px}.stat{font-size:12px;color:#e2eee3}.stat b{color:white;font-size:17px;margin-right:3px}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0 14px}.tabs button,.filter{border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:10px 15px;white-space:nowrap;font-size:13px}.tabs button.active{background:var(--ink);color:white;border-color:var(--ink)}.word{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:18px;margin:10px 0;box-shadow:var(--shadow)}.wordtop{display:flex;justify-content:space-between;align-items:flex-start}.num{font-size:12px;color:#9ba69f}.tag{font-size:11px;background:var(--mint);color:var(--green);padding:5px 8px;border-radius:7px}.en{font-size:22px;font-weight:800;margin:10px 0 3px}.pos{font-size:12px;color:var(--muted);font-weight:500}.meaning{font-size:14px;margin-bottom:12px}.example{background:#f7f8f4;border-radius:11px;padding:11px 12px;font-size:13px;line-height:1.5}.example em{display:block;color:var(--muted);font-style:normal;margin-top:3px}.actions{display:flex;gap:7px;margin-top:13px}.actions button{flex:1;min-height:42px;border-radius:11px;border:1px solid var(--line);background:white;font-size:12px;color:var(--muted);cursor:pointer}.actions button:hover{transform:translateY(-1px)}.actions .done.sel{background:var(--mint);border-color:#a8c8ae;color:var(--green);font-weight:700}.actions .review.sel{background:var(--yellow);border-color:#e6ce74;color:#806719;font-weight:700}.actions .miss.sel{background:var(--red);border-color:#e9aaa0;color:#a44b40;font-weight:700}.quiz{display:none;background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:16px}.quiz.show{display:block}.quiz h2{margin:0 0 8px;font-size:20px}.q{font-weight:700;margin:18px 0 10px}.answers{display:grid;gap:8px}.answers button{text-align:left;padding:12px;border:1px solid var(--line);background:white;border-radius:10px}.answers button.correct{background:var(--mint);border-color:#a8c8ae}.answers button.wrong{background:var(--red);border-color:#e9aaa0}.empty{text-align:center;color:var(--muted);padding:40px 0}.foot{text-align:center;font-size:12px;color:#9ba69f;margin-top:30px}@media(min-width:600px){main{padding-top:34px}.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}.word{margin:0}}
</style></head>
<body><main>
<div class="top"><div class="brand">WORDROOM</div><div class="day">오늘 · 2026.08.27</div></div>
<h1>Day 01<br><span style="color:var(--green)">Business essentials</span></h1><p>일의 흐름을 말하는 핵심 단어 20개</p>
<section class="hero"><p>오늘의 학습 진행률</p><div class="progress"><div class="bar" id="bar"></div></div><div class="stats"><span><b id="doneCount">0</b>완료</span><span><b id="reviewCount">0</b>다시 보기</span><span><b id="leftCount">20</b>남음</span></div></section>
<div class="tabs"><button class="active" data-filter="all">전체 20</button><button data-filter="done">✅ 완료</button><button data-filter="review">🔁 다시 보기</button><button data-filter="miss">⏳ 미완료</button><button id="quizBtn">복습 퀴즈</button></div><div style="display:flex;gap:8px;margin-bottom:14px"><button class="filter" onclick="backup()">⬇️ 백업</button><button class="filter" onclick="document.getElementById('restore').click()">⬆️ 복원</button><button class="filter" onclick="shareTelegram()">✈️ 텔레그램</button><input id="restore" type="file" accept="application/json" hidden onchange="restore(event)"></div>
<section class="words" id="words"></section><section class="quiz" id="quiz"><h2>오늘의 미니 퀴즈</h2><p>단어를 실제 상황에서 떠올려보세요.</p><div id="quizBody"></div></section><div class="foot">단어를 누르면 상태가 이 기기에 자동 저장됩니다.</div>
</main>
<script>
const data=[
['align','v.','의견·목표를 일치시키다','Let’s align on the project goals before the meeting.','회의 전에 프로젝트 목표를 맞춰봅시다.','BUSINESS'],['agenda','n.','회의 안건, 의제','I’ll send the agenda this afternoon.','오늘 오후에 회의 안건을 보내드릴게요.','BUSINESS'],['allocate','v.','할당하다, 배분하다','We need to allocate more time to customer research.','고객 조사에 더 많은 시간을 배분해야 합니다.','BUSINESS'],['approach','n.','접근 방식, 방법','This approach will help us reduce costs.','이 접근 방식은 비용을 줄이는 데 도움이 될 것입니다.','BUSINESS'],['coordinate','v.','조율하다, 협력하다','I’ll coordinate with the design team.','디자인팀과 조율하겠습니다.','BUSINESS'],['deadline','n.','마감 기한','Can we meet the deadline?','마감 기한을 맞출 수 있을까요?','BUSINESS'],['deliverable','n.','결과물, 납품물','The final deliverable is due on Friday.','최종 결과물은 금요일까지입니다.','BUSINESS'],['efficient','adj.','효율적인','We need a more efficient process.','더 효율적인 프로세스가 필요합니다.','BUSINESS'],['feedback','n.','피드백, 의견','Thank you for your valuable feedback.','소중한 피드백 감사합니다.','BUSINESS'],['follow-up','n.','후속 조치, 후속 연락','I’ll send a follow-up email tomorrow.','내일 후속 이메일을 보내겠습니다.','BUSINESS'],['implement','v.','실행하다, 시행하다','We will implement the new policy next month.','다음 달에 새 정책을 시행할 예정입니다.','BUSINESS'],['insight','n.','통찰, 유용한 이해','The report provides valuable insights.','그 보고서는 유용한 통찰을 제공합니다.','BUSINESS'],['negotiate','v.','협상하다','They are negotiating a better contract.','그들은 더 나은 계약을 협상하고 있습니다.','BUSINESS'],['objective','n.','목표','Our main objective is customer satisfaction.','우리의 주요 목표는 고객 만족입니다.','BUSINESS'],['outcome','n.','결과','We are pleased with the outcome.','우리는 그 결과에 만족합니다.','BUSINESS'],['priority','n.','우선순위','Customer safety is our top priority.','고객 안전이 우리의 최우선순위입니다.','BUSINESS'],['proactive','adj.','선제적인, 주도적인','A proactive approach prevents bigger problems.','선제적인 접근은 더 큰 문제를 예방합니다.','COMMUNICATION'],['reliable','adj.','신뢰할 수 있는','We need a reliable partner.','신뢰할 수 있는 파트너가 필요합니다.','COMMUNICATION'],['strategy','n.','전략','Our marketing strategy needs an update.','우리의 마케팅 전략은 업데이트가 필요합니다.','BUSINESS'],['transparent','adj.','투명한, 솔직한','We aim to keep communication transparent.','우리는 소통을 투명하게 유지하려고 합니다.','COMMUNICATION']];
let state=JSON.parse(localStorage.getItem('wordroom-day1')||'{}'), filter='all';
function save(){localStorage.setItem('wordroom-day1',JSON.stringify(state));render()}
function render(){let vals=Object.values(state);let done=vals.filter(x=>x==='done').length, review=vals.filter(x=>x==='review').length;doneCount.textContent=done;reviewCount.textContent=review;leftCount.textContent=20-done;bar.style.width=(done/20*100)+'%';let list=data.map((w,i)=>({w,i})).filter(x=>filter==='all'||state[x.i]===filter);words.innerHTML=list.length?list.map(({w,i})=>{let s=state[i]||'';return `<article class="word"><div class="wordtop"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="tag">${w[5]}</span></div><div class="en">${w[0]} <span class="pos">${w[1]}</span></div><div class="meaning">${w[2]}</div><div class="example">${w[3]}<em>${w[4]}</em></div><div class="actions"><button class="done ${s==='done'?'sel':''}" onclick="setStatus(${i},'done')">✅ 암기 완료</button><button class="review ${s==='review'?'sel':''}" onclick="setStatus(${i},'review')">🔁 다시 보기</button><button class="miss ${s==='miss'?'sel':''}" onclick="setStatus(${i},'miss')">⏳ 미완료</button></div></article>`}).join(''):`<div class="empty">이 카테고리에 단어가 없습니다.</div>`}
function setStatus(i,s){state[i]=state[i]===s?'':s;save()}
document.querySelectorAll('.tabs button[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
quizBtn.onclick=()=>{quiz.classList.toggle('show'); if(quiz.classList.contains('show')) makeQuiz()};
function makeQuiz(){let qs=[[0,'align',['할당하다','의견을 일치시키다','협상하다']], [8,'feedback',['마감 기한','피드백, 의견','결과물']], [10,'implement',['검색하다','실행하다','조율하다']]];quizBody.innerHTML=qs.map((q,n)=>`<div class="q">${n+1}. “${q[1]}”의 뜻은?</div><div class="answers">${q[2].map(a=>`<button onclick="this.classList.add('${a===q[2][1]?'correct':'wrong'}')">${a}</button>`).join('')}</div>`).join('')}
function backup(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wordroom-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.state)throw Error();state=x.state;save();alert('복원되었습니다.')}catch(_){alert('올바른 Wordroom 백업 파일이 아닙니다.')}};r.readAsText(f)}
function shareTelegram(){let done=Object.values(state).filter(x=>x==='done').length,review=Object.values(state).filter(x=>x==='review').length,text=`Wordroom Day 01 학습 현황\\n✅ 완료 ${done}개\\n🔁 다시 보기 ${review}개\\n\\nhttps://jaewonyang1738.github.io/wordroom-day1/`;location.href='https://t.me/share/url?url='+encodeURIComponent('https://jaewonyang1738.github.io/wordroom-day1/')+'&text='+encodeURIComponent(text)}
render();
</script></body></html>
